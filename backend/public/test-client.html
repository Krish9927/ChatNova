<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatNova - Real-time Test Client</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io client CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-indigo-600 text-white py-4 px-6 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">🚀 ChatOps Test Client (Project 5)</h1>
    <div id="connection-status" class="bg-red-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
      Disconnected
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow flex flex-col lg:flex-row p-6 gap-6 max-w-7xl mx-auto w-full">
    
    <!-- Left Sidebar: Auth & Rooms & Online Users -->
    <div class="w-full lg:w-1/3 flex flex-col gap-6">
      
      <!-- Login Section -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">🔑 Authenticate (JWT Login)</h2>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input id="login-email" type="email" required placeholder="user@example.com" class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input id="login-password" type="password" required placeholder="••••••••" class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition duration-200">
            Login & Set Cookie
          </button>
        </form>
        <div id="login-message" class="mt-3 text-sm text-center font-medium"></div>
      </div>

      <!-- Room Selection -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">🚪 Room Selection</h2>
        <div class="flex gap-2">
          <input id="room-input" type="text" value="general" placeholder="Room ID or Name" class="flex-grow px-3 py-2 border rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
          <button id="btn-join-room" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">
            Join
          </button>
        </div>
        <p class="text-xs text-gray-500 mt-2">Currently in: <span id="current-room-label" class="font-bold text-indigo-600">None</span></p>
      </div>

      <!-- Online Users (Redis Presence) -->
      <div class="bg-white p-6 rounded-lg shadow-md flex-grow">
        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex justify-between items-center">
          🟢 Online (Redis Presence)
          <span id="online-count" class="bg-indigo-100 text-indigo-800 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <ul id="online-users-list" class="space-y-2 max-h-60 overflow-y-auto">
          <li class="text-gray-500 text-sm">No users online</li>
        </ul>
      </div>

    </div>

    <!-- Right Chat Area -->
    <div class="w-full lg:w-2/3 flex flex-col bg-white rounded-lg shadow-md overflow-hidden">
      
      <!-- Room Header -->
      <div class="bg-gray-50 px-6 py-4 border-b flex justify-between items-center">
        <div>
          <h3 id="room-header-title" class="text-lg font-bold text-gray-800">Chat Session</h3>
          <p id="typing-indicator" class="text-xs text-gray-500 italic h-4"></p>
        </div>
        <button id="btn-load-more" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-semibold py-1.5 px-3 rounded transition">
          🔄 Load More History
        </button>
      </div>

      <!-- Messages Display -->
      <div id="messages-container" class="flex-grow p-6 overflow-y-auto space-y-4 h-[350px] bg-gray-50">
        <div class="text-center text-gray-400 mt-10">Please authenticate and join a room to start chatting.</div>
      </div>

      <!-- Message Input Form -->
      <form id="message-form" class="border-t p-4 flex gap-4 bg-white">
        <input id="message-input" type="text" autocomplete="off" disabled placeholder="Type your message..." class="flex-grow px-4 py-2 border rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 disabled:bg-gray-100">
        <button type="submit" id="btn-send" disabled class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded transition disabled:bg-gray-400">
          Send
        </button>
      </form>

    </div>

  </main>

  <!-- Script logic -->
  <script>
    let socket = null;
    let currentRoom = null;
    let oldestMessageTimestamp = null; // Used as the cursor for paginated loading

    const statusEl = document.getElementById("connection-status");
    const loginForm = document.getElementById("login-form");
    const loginMsg = document.getElementById("login-message");
    const roomInput = document.getElementById("room-input");
    const joinRoomBtn = document.getElementById("btn-join-room");
    const currentRoomLabel = document.getElementById("current-room-label");
    const onlineUsersList = document.getElementById("online-users-list");
    const onlineCount = document.getElementById("online-count");
    const roomHeaderTitle = document.getElementById("room-header-title");
    const typingIndicator = document.getElementById("typing-indicator");
    const loadMoreBtn = document.getElementById("btn-load-more");
    const messagesContainer = document.getElementById("messages-container");
    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("btn-send");

    let typingTimeout = null;
    let isCurrentlyTyping = false;

    // --- Authentication ---
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      loginMsg.innerText = "Authenticating...";
      loginMsg.className = "mt-3 text-sm text-center text-gray-500";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          loginMsg.innerText = "Successfully Authenticated! Connecting Socket...";
          loginMsg.className = "mt-3 text-sm text-center text-green-600";
          initSocket();
        } else {
          loginMsg.innerText = data.message || "Login failed.";
          loginMsg.className = "mt-3 text-sm text-center text-red-600";
        }
      } catch (err) {
        console.error("Login error:", err);
        loginMsg.innerText = "Network error occurred.";
        loginMsg.className = "mt-3 text-sm text-center text-red-600";
      }
    });

    // --- Socket Initialization ---
    function initSocket() {
      if (socket) {
        socket.disconnect();
      }

      // Establish websocket connection (sends credentials/cookies)
      socket = io({
        withCredentials: true,
        reconnectionAttempts: 5
      });

      socket.on("connect", () => {
        statusEl.innerText = "Connected";
        statusEl.className = "bg-green-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider";
        messageInput.disabled = false;
        sendBtn.disabled = false;
        
        // Auto join if already in a room session
        if (currentRoom) {
          socket.emit("join_room", currentRoom);
        }
      });

      socket.on("disconnect", () => {
        statusEl.innerText = "Disconnected";
        statusEl.className = "bg-red-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider";
        messageInput.disabled = true;
        sendBtn.disabled = true;
      });

      socket.on("connect_error", (err) => {
        console.error("Socket error:", err);
        loginMsg.innerText = "Socket Auth failed: " + err.message;
        loginMsg.className = "mt-3 text-sm text-center text-red-600";
      });

      // Presence update (Redis presence tracking)
      socket.on("presence_update", (onlineUsers) => {
        updatePresenceList(onlineUsers);
      });

      socket.on("getOnlineUsers", (onlineUsers) => {
        updatePresenceList(onlineUsers);
      });

      // Live typing indicator listeners
      socket.on("typing_start", (data) => {
        typingIndicator.innerText = `${data.username} is typing...`;
      });

      socket.on("typing_stop", (data) => {
        typingIndicator.innerText = "";
      });

      // Room lifecycle alerts
      socket.on("user_joined", (data) => {
        appendAlert(`${data.username} joined the chat`);
      });

      socket.on("user_left", (data) => {
        appendAlert(`${data.username} left the chat`);
      });

      // Receive real-time message
      socket.on("new_message", (msg) => {
        appendMessage(msg);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    // --- Presence Rendering ---
    function updatePresenceList(userIds) {
      onlineCount.innerText = userIds.length;
      onlineUsersList.innerHTML = "";
      
      if (userIds.length === 0) {
        onlineUsersList.innerHTML = '<li class="text-gray-500 text-sm">No users online</li>';
        return;
      }

      userIds.forEach(id => {
        const li = document.createElement("li");
        li.className = "flex items-center gap-2 text-sm text-gray-700 bg-gray-50 p-2 rounded";
        li.innerHTML = `
          <span class="w-2.5 h-2.5 bg-green-500 rounded-full inline-block"></span>
          <span class="font-mono text-xs text-gray-500">${id.substring(0, 8)}...</span>
        `;
        onlineUsersList.appendChild(li);
      });
    }

    // --- Join Room Handlers ---
    joinRoomBtn.addEventListener("click", () => {
      const room = roomInput.value.trim();
      if (!room) return;

      if (!socket || !socket.connected) {
        alert("Please login first to establish websocket connection!");
        return;
      }

      if (currentRoom) {
        socket.emit("leave_room", currentRoom);
      }

      currentRoom = room;
      currentRoomLabel.innerText = currentRoom;
      roomHeaderTitle.innerText = `Room: ${currentRoom}`;
      messagesContainer.innerHTML = '<div class="text-center text-gray-400 mt-10">Loading room messages...</div>';
      
      socket.emit("join_room", currentRoom);
      
      // Fetch initial room message history (Day 3 pagination requirement)
      oldestMessageTimestamp = null;
      fetchHistory();
    });

    // --- History Loading (Cursor Pagination) ---
    async function fetchHistory() {
      if (!currentRoom) return;

      let url = `/api/rooms/${currentRoom}/messages`;
      if (oldestMessageTimestamp) {
        url += `?before=${encodeURIComponent(oldestMessageTimestamp)}`;
      }

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (response.ok) {
          if (!oldestMessageTimestamp) {
            messagesContainer.innerHTML = ""; // Clear loader
          }

          // Prepend historical messages to container (so oldest remains at top)
          const messages = data.messages || [];
          if (messages.length === 0 && !oldestMessageTimestamp) {
            messagesContainer.innerHTML = '<div class="text-center text-gray-400 mt-10">No messages in this room yet. Be the first!</div>';
          } else {
            const currentScrollHeight = messagesContainer.scrollHeight;
            
            // Prepend new batch
            messages.forEach(msg => {
              appendMessage(msg, true);
            });

            // Adjust scroll position after prepending
            messagesContainer.scrollTop = messagesContainer.scrollHeight - currentScrollHeight;
          }

          // Update cursor state
          if (data.nextCursor) {
            oldestMessageTimestamp = data.nextCursor;
            loadMoreBtn.classList.remove("hidden");
          } else {
            oldestMessageTimestamp = null;
            loadMoreBtn.classList.add("hidden");
          }
        } else {
          console.error("Failed to fetch history:", data.message);
        }
      } catch (err) {
        console.error("Error fetching history:", err);
      }
    }

    loadMoreBtn.addEventListener("click", fetchHistory);

    // --- Sending Messages ---
    messageForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const content = messageInput.value.trim();
      if (!content || !currentRoom || !socket) return;

      // Emit message payload to server room
      socket.emit("send_message", {
        roomId: currentRoom,
        content: content
      });

      // Reset typing state
      clearTimeout(typingTimeout);
      isCurrentlyTyping = false;
      socket.emit("typing_stop", currentRoom);

      messageInput.value = "";
    });

    // --- Typing Heartbeats ---
    messageInput.addEventListener("input", () => {
      if (!currentRoom || !socket) return;

      if (!isCurrentlyTyping) {
        isCurrentlyTyping = true;
        socket.emit("typing_start", currentRoom);
      }

      // Debounce typing status resets
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        isCurrentlyTyping = false;
        socket.emit("typing_stop", currentRoom);
      }, 2000);
    });

    // --- Visual Dom Helpers ---
    function appendMessage(msg, prepend = false) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "flex flex-col max-w-lg rounded-lg p-3 shadow-sm text-sm " + 
        (msg.sender_id === "Self" || msg.is_self ? "bg-indigo-100 self-end ml-auto" : "bg-white self-start");
      
      const sender = document.createElement("span");
      sender.className = "font-semibold text-xs text-gray-500 mb-1";
      sender.innerText = msg.sender_id;

      const body = document.createElement("p");
      body.className = "text-gray-800 break-words";
      body.innerText = msg.content;

      const time = document.createElement("span");
      time.className = "text-[10px] text-gray-400 text-right mt-1 select-none";
      time.innerText = new Date(msg.created_at).toLocaleTimeString();

      msgDiv.appendChild(sender);
      msgDiv.appendChild(body);
      msgDiv.appendChild(time);

      if (prepend) {
        messagesContainer.insertBefore(msgDiv, messagesContainer.firstChild);
      } else {
        messagesContainer.appendChild(msgDiv);
      }
    }

    function appendAlert(text) {
      const alertDiv = document.createElement("div");
      alertDiv.className = "text-center text-xs font-semibold text-gray-400 bg-gray-100 py-1.5 px-3 rounded-full w-fit mx-auto my-2";
      alertDiv.innerText = text;
      messagesContainer.appendChild(alertDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

  </script>
</body>
</html>
